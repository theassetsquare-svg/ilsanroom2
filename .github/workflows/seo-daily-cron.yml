name: SEO Daily Cron
on:
  schedule:
    - cron: '0 3 * * *'   # KST 12:00 (UTC 03:00)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update sitemap.xml lastmod to today
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          sed -i "s|<lastmod>.*</lastmod>|<lastmod>${TODAY}</lastmod>|g" sitemap.xml
          cat sitemap.xml

      - name: Ping Google sitemap
        run: |
          curl -sSf "https://www.google.com/ping?sitemap=https://ilsanroom2.pages.dev/sitemap.xml" || true

      - name: Ping Bing IndexNow (key required as secret INDEXNOW_KEY)
        if: env.INDEXNOW_KEY != ''
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          curl -sSf -X POST "https://api.indexnow.org/IndexNow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "{\"host\":\"ilsanroom2.pages.dev\",\"key\":\"${INDEXNOW_KEY}\",\"urlList\":[\"https://ilsanroom2.pages.dev/\",\"https://ilsanroom2.pages.dev/guide/\",\"https://ilsanroom2.pages.dev/review/\",\"https://ilsanroom2.pages.dev/reservation/\",\"https://ilsanroom2.pages.dev/parking/\",\"https://ilsanroom2.pages.dev/area/\",\"https://ilsanroom2.pages.dev/faq/\",\"https://ilsanroom2.pages.dev/legal/\"]}" || true

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          if git diff --cached --quiet; then
            echo "No sitemap changes."
          else
            git commit -m "chore(seo): daily sitemap lastmod $(date -u +%Y-%m-%d)"
            git push
          fi
