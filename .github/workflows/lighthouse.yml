name: Lighthouse CI (Daily)

on:
  schedule:
    # 03:30 KST daily (= 18:30 UTC previous day)
    - cron: '30 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        url:
          - https://ilsanroom2.pages.dev/
          - https://ilsanroom2.pages.dev/guide/
          - https://ilsanroom2.pages.dev/review/
          - https://ilsanroom2.pages.dev/reservation/
          - https://ilsanroom2.pages.dev/parking/
          - https://ilsanroom2.pages.dev/area/
          - https://ilsanroom2.pages.dev/faq/
          - https://ilsanroom2.pages.dev/legal/
    steps:
      - name: Audit ${{ matrix.url }} (mobile)
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: ${{ matrix.url }}
          uploadArtifacts: true
          temporaryPublicStorage: true
          configPath: ./.github/lighthouse-config.json
