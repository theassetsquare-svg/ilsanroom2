name: Live Health Check
on:
  schedule:
    - cron: '0 */6 * * *'   # 6시간마다
  workflow_dispatch:

# issues:write → 문제 시 GitHub 이슈 생성(시크릿 없이도 오너에게 자동 메일 통지)
permissions:
  contents: read
  issues: write

jobs:
  health:
    runs-on: ubuntu-latest
    env:
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Check 200 OK on all endpoints
        run: |
          set -e
          for URL in \
            "https://ilsanroom2.pages.dev/" \
            "https://ilsanroom2.pages.dev/legal/" \
            "https://ilsanroom2.pages.dev/sitemap.xml" \
            "https://ilsanroom2.pages.dev/robots.txt" \
            "https://ilsanroom2.pages.dev/llms.txt" \
            "https://ilsanroom2.pages.dev/site.webmanifest" \
            "https://ilsanroom2.pages.dev/sw.js" \
            "https://ilsanroom2.pages.dev/icon-192.png" \
            "https://ilsanroom2.pages.dev/icon-512.png" \
            "https://ilsanroom2.pages.dev/og-image.png" ; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
            if [ "$STATUS" != "200" ]; then
              echo "::error::$URL → HTTP $STATUS"
              exit 1
            fi
            echo "✅ $URL → 200"
          done

      - name: Check key meta tags present
        run: |
          HTML=$(curl -sL https://ilsanroom2.pages.dev/)
          for NEEDLE in \
            "<title>" \
            "canonical" \
            "og:url" \
            "manifest" \
            "theme-color" \
            "FAQPage" \
            "LocalBusiness" ; do
            if echo "$HTML" | grep -q "$NEEDLE"; then
              echo "✅ $NEEDLE present"
            else
              echo "::error::$NEEDLE missing"
              exit 1
            fi
          done

      - name: Email alert if site is down / broken
        if: ${{ failure() && env.GMAIL_APP_PASSWORD != '' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          from: ilsanroom2 SEO Bot <${{ secrets.GMAIL_USER }}>
          to: theassetsquare@gmail.com
          subject: '[ilsanroom2][🚨] 라이브 사이트 장애 감지'
          body: |
            라이브 헬스체크가 실패했습니다 (사이트 다운 또는 핵심 메타 누락).

            로그 확인:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

      # 시크릿이 없어도 항상 동작하는 알림: 열린 이슈가 없으면 생성(중복 방지),
      # 이슈 생성 → GitHub이 저장소 오너(theassetsquare@gmail.com)에게 자동 메일.
      - name: Open issue on failure (no secret needed)
        if: ${{ failure() }}
        uses: actions/github-script@v7
        with:
          script: |
            const title = '🚨 라이브 사이트 장애 감지 (Live Health Check 실패)';
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `자동 헬스체크가 실패했습니다 (사이트 다운 또는 핵심 메타 누락).\n\n로그: ${runUrl}\n\n시간(UTC): ${new Date().toISOString()}`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'site-down', per_page: 5,
            });
            if (existing.data.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.data[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['site-down'],
              });
            }

      # 사이트가 정상 복구되면 열린 장애 이슈를 자동으로 닫음(자동 해결).
      - name: Auto-close issue on recovery
        if: ${{ success() }}
        uses: actions/github-script@v7
        with:
          script: |
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'site-down', per_page: 10,
            });
            for (const iss of open.data) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: iss.number,
                body: `✅ 사이트 정상 복구 확인 — 이슈 자동 종료. (UTC ${new Date().toISOString()})`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: iss.number, state: 'closed',
              });
            }
